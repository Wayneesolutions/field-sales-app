# Builds the APK locally on the GitHub Actions Linux runner.
# Uses EAS only to fetch the Android keystore (no cloud build credits consumed).
# Needs: repo secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Run from GitHub → Actions → "Build APK" → Run workflow.
# Download the APK from the workflow run's Artifacts section.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK locally (no EAS cloud credits)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: eas build -p android --profile apk --local --non-interactive --output ./field-sales.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-sales-apk
          path: field-sales.apk
          retention-days: 30
